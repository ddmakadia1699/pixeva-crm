AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pixeva CRM AWS SAM Serverless Backend (Python 3.14)

Parameters:
  SupabaseUrl:
    Type: String
    Default: https://batspallqzaxubikuuks.supabase.co
    Description: Supabase project URL (public).
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase secret (service-role) key. Supply at deploy time; never commit it.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: >-
      Comma-separated browser origins allowed by CORS, e.g.
      https://pixeva-crm.vercel.app,http://localhost:3000. Use '*' only while testing.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - x86_64
    # All six functions share one package (lambda/src): common/ helpers + handlers/ entry points.
    CodeUri: lambda/src/
    Environment:
      Variables:
        NEXT_PUBLIC_SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
        RATE_LIMIT_TABLE: !Ref RateLimitTable

Resources:
  # ---------------------------------------------------------------------------
  # Per-identity rate limiting (see lambda/src/common/ratelimit.py).
  # Fixed-window counters; DynamoDB TTL deletes expired windows automatically.
  # ---------------------------------------------------------------------------
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Least privilege: the functions may only increment counters in this one table.
  RateLimitAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt RateLimitTable.Arn

  # ---------------------------------------------------------------------------
  # Amazon API Gateway (HTTP API). Layer 1 of abuse protection: gateway throttling.
  # Per-caller budgets are enforced in the Lambdas (layer 2).
  # ---------------------------------------------------------------------------
  PixevaApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      # Tighter gateway-wide caps on the expensive and the public (unauthenticated) routes.
      RouteSettings:
        "POST /pdf-generator":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "POST /batch-email":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "POST /enquiries":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 600

  # 1. Enquiries Microservice (one event per method so POST can be throttled on its own)
  EnquiriesServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.enquiries_service.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        EnquiriesList:
          Type: HttpApi
          Properties:
            Path: /enquiries
            Method: GET
            ApiId: !Ref PixevaApiGateway
        EnquiriesCreate:
          Type: HttpApi
          Properties:
            Path: /enquiries
            Method: POST
            ApiId: !Ref PixevaApiGateway
        EnquiriesUpdate:
          Type: HttpApi
          Properties:
            Path: /enquiries
            Method: PUT
            ApiId: !Ref PixevaApiGateway
        EnquiriesDelete:
          Type: HttpApi
          Properties:
            Path: /enquiries
            Method: DELETE
            ApiId: !Ref PixevaApiGateway

  # 2. Contracts Microservice
  ContractsServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.contracts_service.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        ContractsApi:
          Type: HttpApi
          Properties:
            Path: /contracts
            Method: ANY
            ApiId: !Ref PixevaApiGateway

  # 3. Bookings Microservice
  BookingsServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.bookings_service.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        BookingsApi:
          Type: HttpApi
          Properties:
            Path: /bookings
            Method: ANY
            ApiId: !Ref PixevaApiGateway

  # 4. PDF Generator Microservice
  PdfGeneratorServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.pdf_generator.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        PdfApi:
          Type: HttpApi
          Properties:
            Path: /pdf-generator
            Method: POST
            ApiId: !Ref PixevaApiGateway

  # 5. Batch Email Microservice
  BatchEmailServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.batch_email.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        BatchEmailApi:
          Type: HttpApi
          Properties:
            Path: /batch-email
            Method: POST
            ApiId: !Ref PixevaApiGateway

  # 6. Studio Data Microservice (Galleries, Finances, Client Requests, Dashboard)
  # The handler routes by path, so every path the frontend calls maps to this function.
  StudioDataServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.studio_data_service.handler
      Policies:
        - !Ref RateLimitAccessPolicy
      Events:
        StudioDataApi:
          Type: HttpApi
          Properties:
            Path: /studio-data
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        GalleriesApi:
          Type: HttpApi
          Properties:
            Path: /galleries
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        ClientRequestsApi:
          Type: HttpApi
          Properties:
            Path: /client-requests
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        FinancesApi:
          Type: HttpApi
          Properties:
            Path: /finances
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        DashboardApi:
          Type: HttpApi
          Properties:
            Path: /dashboard
            Method: ANY
            ApiId: !Ref PixevaApiGateway

Outputs:
  PixevaApiGatewayUrl:
    Description: Live SAM Amazon API Gateway HTTP Base URL
    Value: !Sub "https://${PixevaApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
  RateLimitTableName:
    Description: DynamoDB table holding rate-limit counters
    Value: !Ref RateLimitTable
