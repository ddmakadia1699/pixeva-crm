AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pixeva CRM AWS SAM Serverless Backend

Parameters:
  SupabaseUrl:
    Type: String
    Default: https://batspallqzaxubikuuks.supabase.co
    Description: Supabase project URL (public).
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase secret (service-role) key. Supply at deploy time; never commit it.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Browser origin allowed by CORS, e.g. https://your-app.vercel.app. Use '*' only while testing.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs22.x
    Environment:
      Variables:
        NEXT_PUBLIC_SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey

Resources:
  # Amazon API Gateway (HTTP API)
  PixevaApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      # Limits abuse of the one unauthenticated route (public enquiry form).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - x-account-id
        MaxAge: 600

  # 1. Enquiries Microservice
  EnquiriesServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/enquiries-service/dist/
      Handler: index.handler
      Events:
        EnquiriesApi:
          Type: HttpApi
          Properties:
            Path: /enquiries
            Method: ANY
            ApiId: !Ref PixevaApiGateway

  # 2. Contracts Microservice
  ContractsServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/contracts-service/dist/
      Handler: index.handler
      Events:
        ContractsApi:
          Type: HttpApi
          Properties:
            Path: /contracts
            Method: ANY
            ApiId: !Ref PixevaApiGateway

  # 3. Bookings Microservice
  BookingsServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/bookings-service/dist/
      Handler: index.handler
      Events:
        BookingsApi:
          Type: HttpApi
          Properties:
            Path: /bookings
            Method: ANY
            ApiId: !Ref PixevaApiGateway

  # 4. PDF Generator Microservice
  PdfGeneratorServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/pdf-generator/dist/
      Handler: index.handler
      Events:
        PdfApi:
          Type: HttpApi
          Properties:
            Path: /pdf-generator
            Method: POST
            ApiId: !Ref PixevaApiGateway

  # 5. Batch Email Microservice
  BatchEmailServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/batch-email/dist/
      Handler: index.handler
      Events:
        BatchEmailApi:
          Type: HttpApi
          Properties:
            Path: /batch-email
            Method: POST
            ApiId: !Ref PixevaApiGateway

  # 6. Studio Data Microservice (Galleries, Finances, Client Requests, Dashboard)
  # The handler routes by path, so every path the frontend calls maps to this function.
  StudioDataServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/functions/studio-data-service/dist/
      Handler: index.handler
      Events:
        StudioDataApi:
          Type: HttpApi
          Properties:
            Path: /studio-data
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        GalleriesApi:
          Type: HttpApi
          Properties:
            Path: /galleries
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        ClientRequestsApi:
          Type: HttpApi
          Properties:
            Path: /client-requests
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        FinancesApi:
          Type: HttpApi
          Properties:
            Path: /finances
            Method: ANY
            ApiId: !Ref PixevaApiGateway
        DashboardApi:
          Type: HttpApi
          Properties:
            Path: /dashboard
            Method: ANY
            ApiId: !Ref PixevaApiGateway

Outputs:
  PixevaApiGatewayUrl:
    Description: Live SAM Amazon API Gateway HTTP Base URL
    Value: !Sub "https://${PixevaApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
